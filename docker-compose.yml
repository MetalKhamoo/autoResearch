version: "3.11"

services:
  api:
    build: .
    container_name: autoresearch-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite DB and ChromaDB outside the container
      - ./data:/app/data
      - ./chroma_data:/app/chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Phase 8: add postgres, redis services here if needed
